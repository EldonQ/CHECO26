# CHECO26 N-SDM 数据汇编 —— 集中参数配置（唯一参数来源，代码零魔法数）
# 修改本文件即视为版本变更：必须重跑受影响的全部层，并在 logs/lineage.csv 留痕。

grid:
  # China Albers 等面积（与 CLCD 官方投影完全一致的参数），WKT 见 crs_wkt
  resolution: 1000.0
  # 边界依据 china.shp 投影后外包矩形 + 10km 缓冲，向 1km 取整（2026-08-08 实测验证）
  xmin: -2648000
  ymin: 1867000
  xmax: 2213000
  ymax: 5929000
  # -> 4861 列 x 4062 行
  crs_wkt: >-
    PROJCS["China_Albers",GEOGCS["WGS 84",DATUM["WGS_1984",SPHEROID["WGS 84",6378137,298.257223563]],
    PRIMEM["Greenwich",0],UNIT["degree",0.0174532925199433]],
    PROJECTION["Albers_Conic_Equal_Area"],PARAMETER["latitude_of_center",0],
    PARAMETER["longitude_of_center",105],PARAMETER["standard_parallel_1",25],
    PARAMETER["standard_parallel_2",47],PARAMETER["false_easting",0],
    PARAMETER["false_northing",0],UNIT["metre",1]]

mask:
  all_touched: true            # 保留海岛与海岸线（口径见 00_docs）
  apply_to_all_layers: true    # 全部入库层裁剪至国界内（warp 默认应用 mask_china.tif；
                               #   2026-08-07 审计发现此前掩膜仅生成未应用，770 层含境外像元，
                               #   已全库强制重跑修复；08_validate 设 OVER-MASK 硬门槛）

nodata:
  float: -9999.0               # 所有 float32 连续层
  uint8_categorical: 255       # 分类层

resampling:                    # 重采样固定规则，运行时不得更改
  categorical: nearest
  continuous: bilinear
  proportion: bilinear
  distance: bilinear
  downscale_continuous: average   # 细分辨率源（30m/90m）大比例降尺度：窗口均值聚合
  downscale_categorical: mode     # 细分辨率分类层：窗口众数聚合
  downscale_min: min              # 窗口最小值（水体可达性语义，2026-08-08 hydro 精选统计增补）
  downscale_max: max              # 窗口最大值（干流/最陡/最湿语义，同上）

# hydro 精选统计增补（2026-08-08 定案）：只补有生态语义的统计量，不铺 median；
# 动机：90m->1km 单 mean 丢胞内结构；min/max 对淡水鱼有直接可达性/极值语义。
# 入库前自动方差筛查拦截常量层；新层仅入候选池不入 core_subset。
hydro_stats_addon:
  minmax: [stream_dist_proximity, stream_dist_dw_near, stream_dist_up_near, stream_dist_up_farth,
           channel_elv_dw_cel, channel_elv_dw_seg, channel_elv_up_cel, channel_elv_up_seg]
  # 2026-08-08 入库前审计定案移除：cti 源值 99.9%% 像元 |x|>1e6（单位/口径异常）；
  # channel_grad 3 变量源值中位数 ~9e4 cm/m、max 1.6e9（物理上限 100 cm/m，源产品异常）。
  # 2026-10-06：cti/channel_grad 3/slope_curv 2/accumulation 一并从交付树撤出
  # （hydro90m_vars.withdrawn）。spi/sti 本身正常，其 max 增补层保留。
  maxonly: [spi, sti]

focal:
  radii_km: [1, 5, 10, 20]     # 与 SWECO25/N-SDM 惯例一致的固定窗口半径
  stat: mean                   # 等权均值窗口（terra focal 的 scipy 等价实现）

derivations:                   # 派生指标固定定义（文献出处写死于此）
  tri: "Riley et al. 1999, 3x3 邻域高差 RMS"
  shannon: "-sum(p*ln(p)), 自然对数, p 为窗口内类别比例"
  edge_density: "FRAGSTATS 口径 (McGarigal 2002): 与 4 邻域类别不同即为边缘像元"
  patch_density: "FRAGSTATS 类口径 (McGarigal 2002): 圆盘窗口内斑块数/窗口面积, 个/100km2; 斑块=4邻域连通; 锚点近似(每斑块扫描序首像元), 窗口边缘斑块锚点在窗外时不计入"
  patch_size: "窗口内锚点落入斑块的平均面积 km2; 口径同上; scope=all 全类别景观 / forest 仅森林"

units_scale:                   # 入库统一单位口径（存值=原生值 x scale）；出处全部写死
  soil_csdlv2:                 # CSDLv2 readme (Shi & Shangguan 2024): 存储值/scale=实值
    default: 0.01              # int16 存储 x 0.01 -> pH(-)/BD(g/cm3)/sand,silt,clay,gravel,porosity(%)/OC,TN,TP,TK(g/100g)/SOCD(kg C m-2)/CEC(me/100g)/颜色 RGB 与 Munsell
    AN: 0.1                    # 碱解氮 mg/kg
    AK: 0.1                    # 速效钾 mg/kg
  foothii: 0.01                # WCS footHII 存值为整数, x0.01 -> 指数。实测 raw 上限逐年上升:
                               #   2001-2011=5900, 2012-2014=6000, 2015-2020=6400 -> 指数上限 64
                               #   (2026-10-17 核查修正; 原注释误写 0-5900/0-59, 只对 2001 年成立)
  canopy_height: 0.01          # 冠层高度源存储 cm -> m。2026-10-09 修正：原值 0.1（误按 dm 处理）
                               #   使 5 个冠层高层数值大 10 倍（1km 基底最大 586 m，物理不可能）。
                               #   判定依据（三重）：① 全球最高树 115.9 m；② 源 raw÷100 后森林区
                               #   均值/标准差 = 15.03/5.41 m，复现该产品论文发表的 15.90/5.77 m
                               #   (Liu et al. 2022, RSE 269:112844)；③ 配套 AGB 产品在同像元上
                               #   复现其发表均值 99.02 vs 97.57 Mg/ha，证明像元范围正确。
                               #   原层已备份于 scratch/backup_canopy_pre_unitfix/
  h90m_dist_m: 1.0             # Hydrography90m 距离/高差类：源已是 m，不缩放。
                               #   2026-10-18 修正：原值 0.01（误判为 cm）使 19 个距离/高差
                               #   变量小 100 倍。判定依据（决定性，几何必然）：
                               #   channel_dist_up_cel = 「焦点像元到下一像元的上游距离」，
                               #   90 m 网格上相邻像元只可能是 90 m（正交）或 127.3 m（对角）；
                               #   源 Final 实测 [55, 111, 128]（min/中位/max）正是米，
                               #   而交付层实测 [0.55, 1.28]，按米读等于两像元相距 0.55 m，
                               #   几何上不可能。源瓦片 README 亦明确写 "m"（无缩放因子）。
                               #   另补三组 README 声明但此前漏施加的缩放因子：
  h90m_curv_grad: 1.0e-6       # channel_curv_cel / slope_curv_* / channel_grad_* / slope_grad_dw_cel
                               #   README: m-1 或 unit-less, scale factor 1,000,000
  h90m_index: 1.0e-3           # cti / spi / sti —— README: unit-less, scale factor 1000
                               #   上述两组的原层已备份于 scratch/backup_h90m_scale_pre_fix_20261018/
  ndvi: 0.0001                 # GLASS NDVImax 30m 存储 int16 x 0.0001 -> NDVI(-1..1)

hydro90m_vars:                 # Hydrography90m China Final 全量变量（零裁剪，盘上实测 40 个）
  # 2026-10-06 定案撤出交付：源产品数值不可用（cti 亿级、channel_grad 超物理上限、
  # slope_curv 对称饱和 ±384900、accumulation 源含负值）；成品经逐像元验证为源的忠实降尺度，
  # 重跑无法修复，故撤出。清单见 logs/withdrawn_layers_manifest.csv。
  withdrawn: [cti, channel_grad_dw_seg, channel_grad_up_cel, channel_grad_up_seg,
              slope_curv_max_dw_cel, slope_curv_min_dw_cel, accumulation]
  categorical: [basin, direction, order_hack, order_horton, order_shreve, order_strahler, order_topo, outlet, segment, sub_catchment]
  continuous: [accumulation, channel_curv_cel, channel_dist_dw_seg, channel_dist_up_cel, channel_dist_up_seg, channel_elv_dw_cel, channel_elv_dw_seg, channel_elv_up_cel, channel_elv_up_seg, channel_grad_dw_seg, channel_grad_up_cel, channel_grad_up_seg, cti, outlet_diff_dw_basin, outlet_diff_dw_scatch, outlet_dist_dw_basin, outlet_dist_dw_scatch, slope_curv_max_dw_cel, slope_curv_min_dw_cel, slope_elv_dw_cel, slope_grad_dw_cel, spi, sti, stream_diff_dw_near, stream_diff_up_farth, stream_diff_up_near, stream_dist_dw_near, stream_dist_proximity, stream_dist_up_farth, stream_dist_up_near]
  # 单位换算因子：存值 = 源值 x factor。依据源瓦片 README（2026-10-18 核对）
  # 距离/高程差 18 变量：README 单位就是 m，无 factor -> 不列在此表即不缩放
  scale_by_var:
    channel_curv_cel: 1.0e-6        # README: m-1 (scale factor 1000000)
    slope_curv_max_dw_cel: 1.0e-6   # README: m-1 (scale factor 1000000)
    slope_curv_min_dw_cel: 1.0e-6   # README: m-1 (scale factor 1000000)
    channel_grad_dw_seg: 1.0e-6     # README: unit-less (scale factor 1000000)
    channel_grad_up_cel: 1.0e-6     # README: unit-less (scale factor 1000000)
    channel_grad_up_seg: 1.0e-6     # README: unit-less (scale factor 1000000)
    slope_grad_dw_cel: 1.0e-6       # README: unit-less (scale factor 1000000)
    cti: 1.0e-3                     # README: unit-less (scale factor 1000)
    spi: 1.0e-3                     # README: unit-less (scale factor 1000)
    sti: 1.0e-3                     # README: unit-less (scale factor 1000)
  # 2026-10-18 实测发现该族单位不统一：slope_elv_dw_cel 的源以厘米存储，
  # 其余 9 个高程差变量为米。判定依据「高差/距离=坡度」逐像元检验：
  #   9 个米制变量 p50 坡度 = 0.031 .. 0.111（3%–11%，中国地形合理）
  #   slope_elv_dw_cel   p50 坡度 = 8.837（883%，不可能）；x0.01 后 = 0.088（8.8%）合理
  scale_cm_exception:
    slope_elv_dw_cel: 0.01      # 唯一需要 cm->m 的成员
  # 源内哨兵值：必须先置为 nodata 再聚合，否则 1km 平均会把它抹成连续污染
  src_sentinel:
    # README 明示出口像元值 = 99999；但源里该哨兵被 GRASS 累加扩散，
    # 实测 >50000 的像元共 30,739 个，取值区间 [99,838, 105,245]。
    # 因此阈值必须取一个**位于该污染带以下的下界**（50,000），
    # 若按 99,999 掩膜会漏掉 [99,838, 99,998] 这 12 个像元，
    # 经 90m->1km 平均后仍会把单像元污染放大到 ~800 m（2026-10-19 实测）。
    channel_elv_up_cel: 50000
  scale_cm2m: []                    # 已废弃：2026-10-18 证实源已是 m，原 0.01 为误判

smmod_urban_classes: [21, 22, 23]   # GHS-SMOD 城市类别（低/中/高密度建成区）

# 距离要素固定定义（实测源结构后定案，代码零魔法数）
grip4_field: "GP_RTP"            # GRIP4_region6.shp 道路类型字段（大写，整型编码）
grip4_major_codes: [1, 2, 3]     # 主干道 = Highways(1)+Primary roads(2)+Secondary roads(3)；图例源:GRIP4_AttributeDescription.xlsx（4=Tertiary,5=Local,0=Unspecified）
osm_trail_where: "highway IN ('path','footway')"   # 步道定义；源 china-260805.osm.pbf 实测匹配 793636 条；pbf 本身即中国区抽取，无需 bbox
gsw_invalid_value: 255           # GSW extent 无效值（海洋/无数据），实测取值 {0,1,255}，1=水体

landscan_years: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]   # 零裁剪：全 25 年
foothii_years: [2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020]   # 盘上实测 2001-2020 共 20 年（源无 2021，零裁剪如实入库）
smod_epochs: [1975, 1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2020, 2025, 2030]   # 全 12 epoch
ndvi_years: [2020, 2021, 2022]      # 源上限 3 年

lulc_legend:                   # Zhang et al. 2023 (figshare.23542860) 原生图例; 0=背景→NA
  1: cropland
  2: forest
  3: grassland
  4: urban
  5: barren
  6: water

climate:
  chains: [ensmean, bcc_csm2_mr]     # 用户定案：仅两条链入主树
  ssps: [ssp126, ssp245, ssp585]
  periods:                            # 目录中心年 -> 源数据原生时段文件夹名
    "2030": "2021_2040"
    "2055": "2041_2070"
    "2085": "2071_2100"

lulc_scenarios:                # 未来 LULC 原生快照（与气候 SSP 口径一致，仅 126/245/585）
  ssps: [ssp126, ssp245, ssp585]
  years: [2030, 2050, 2100]

paths:
  root: "E:/CHECO26/N-SDM"
  covariates: "E:/CHECO26/N-SDM/data/covariates"
  docs: "E:/CHECO26/N-SDM/00_docs"
  logs: "E:/CHECO26/N-SDM/logs"
  archive: "E:/CHECO26/N-SDM/archive"
  scratch: "E:/CHECO26/N-SDM/scratch"
  china_shp: "E:/CHECO26/china/china.shp"
  # ---- 源数据 ----
  bioclim: "E:/CHECO26/Bioclim/CHNECO26_Bioclim/bioclim"
  soil_1km: "E:/CHECO26/CSDLv2/1km"
  dem_final: "E:/CHECO26/DEM/China_DEM_1km"          # elev/slope 实际源（chdem_105.tif / chdem_Slope.tif）；旧 E:/CHECO26/Final 已于 2026-08-07 全库校验通过后删除
  hydro_final: "E:/h90m/Final"                            # 60 层旧成果
  lulc_raw: "E:/CHECO26/Global LULC projection dataset from 2020 to 2100 at a 1km resolution/23542860"
  ndvi_30m: "E:/CHECO26/NDVI_forest aboveground biomass_forest canopy height/30mNDVI"
  agb: "E:/CHECO26/NDVI_forest aboveground biomass_forest canopy height/forest aboveground biomass/_"
  canopy_height: "E:/CHECO26/NDVI_forest aboveground biomass_forest canopy height/forest canopy height/_"
  catcd: "E:/CHECO26/CATCD_2025/CATCD_2025.tif"
  landscan: "E:/CHECO26/people_landscan"
  foothii: "E:/CHECO26/WCS-footHII"
  smod_ghs: "E:/CHECO26/GHSL_GHS-SMOD_R2023A"
  gsw_extent: "E:/CHECO26/JRC_Global_Surface_Water_v1_5/extent_china"   # 42 片 extent 瓦片（已核查）
  grip4_root: "E:/CHECO26/Globio/GRIP4_Region6_vector_shp"   # GRIP4_region6.shp（Meijer et al. 2018）
  osm_pbf: "E:/CHECO26/OpenStreetMap/china-260805.osm.pbf"   # OSM 步道源（ODbL 许可）
  stream_dist: "E:/h90m/Final"                            # stream_dist_proximity 4 层

runtime:
  workers: 16                  # 层间进程池（48 核机器取 16，兼顾 IO 与内存）
  gdal_threads: 8              # 单 warp 内 GDAL 线程
  # terra 单进程可用内存上限（占物理内存比例）。多进程并发时必须压低，
  # 否则每个进程都按"可用 60% 内存"规划，8 进程即超额承诺 -> std::bad_alloc。
  # 2026-10-19 实测：0.12（约 15 GB/进程）在 6-8 并发下稳定。
  terra_memfrac: 0.12
